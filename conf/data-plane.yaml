deployment:
  role: data_plane
  role_data_plane:
    config_provider: etcd

  etcd:
    host:
      - "http://etcd1:2379"
      - "http://etcd2:2379"
      - "http://etcd3:2379"
    prefix: "/apisix"
    timeout: 30

apisix:
  node_listen:
    - port: 9080

  ssl:
    enable: true
    listen:
      - port: 9443
    ssl_protocols: TLSv1.2 TLSv1.3
  enable_admin: false
  show_upstream_status_in_response_header: true

plugins:
# AI Gateway Core Plugins
  - ai-proxy
  - ai-proxy-multi
  - ai-prompt-guard
  - ai-prompt-decorator
  - ai-rate-limiting
  # Security, Traffic & Observability
  - key-auth
  - cors
  - gzip
  - limit-conn
  - limit-count
  - limit-req
  - proxy-cache
  - proxy-rewrite
  - response-rewrite
  - forward-auth
  - request-id
  - prometheus




















